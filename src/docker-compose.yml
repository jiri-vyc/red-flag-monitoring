# Local development database only. Not for any shared or deployed environment.
name: red-flag-monitoring
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-red_flag_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-red_flag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-red_flag_local}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
